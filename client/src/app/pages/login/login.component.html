@if(!token) {
<img [src]="logo" class="logo" />
<div class="login">
  <p class="title">Login to the FairGround</p>
  <form [formGroup]="form" class="form" (ngSubmit)="onSubmit()">
    <div class="email">
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Email"
        class="login__input"
        [ngClass]="{
          invalid:
            form.get('email')?.invalid &&
            (form.get('email')?.dirty ||
              form.get('email')?.touched ||
              isSubmitted)
        }"
      />
      <span
        *ngIf="
          form.get('email')?.invalid &&
          (form.get('email')?.dirty ||
            form.get('email')?.touched ||
            form.get('email')?.value)
        "
        class="error"
        >Enter a valid email</span
      >
    </div>
    <div class="password">
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Password"
        class="login__input"
        [ngClass]="{
          invalid:
            form.get('password')?.invalid &&
            (form.get('password')?.dirty ||
              form.get('password')?.touched ||
              isSubmitted)
        }"
      />
      <span
        *ngIf="
          form.get('password')?.invalid &&
          (form.get('password')?.dirty ||
            form.get('password')?.touched ||
            form.get('password')?.value)
        "
        class="error"
        >Enter a valid password</span
      >
    </div>
    <button type="submit" class="button">Entry</button>
    <div class="line">
      <p class="line-text">or</p>
    </div>
    <button class="second-button" (click)="redirectToRegistr()">
      Create new account
    </button>
  </form>
</div>
}
