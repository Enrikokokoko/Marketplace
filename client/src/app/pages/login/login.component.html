@if(!token) {
  <img [src]="logo" class="logo">
  <div class="login">
    <p class="title">Login to the FairGround</p>
    <form [formGroup]="form" class="form" (ngSubmit)="onSubmit()">
    <input id="email" type="text" formControlName="email" placeholder="Email" class="login__input">
  
    <input id="password" type="password" formControlName="password" placeholder="Password" class="login__input">
    <button type="submit" class="button">Entry</button>
    <div class="line">
      <p class="line-text">or</p>
    </div>
      <button class="second-button" (click)="redirectToRegistr()">Create new account</button>
    </form>
  </div>  
}
